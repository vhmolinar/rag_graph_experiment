[project]
name = "rag-books"
version = "0.1.0"
description = "RAG de livros — fase 1 (privado, local)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "pgvector==0.5.0",
    "psycopg[binary,pool]==3.3.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.0",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
    "T20", # flake8-print (proíbe print; logging estruturado)
    "ANN", # anotações de tipo obrigatórias
    "ASYNC",
    "PT",  # flake8-pytest-style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"] # asserts e fixtures sem anotação são aceitos em testes

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["rag"]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requer serviços externos (PostgreSQL via testcontainers)",
    "contract: testes de contrato HTTP com servidor simulado",
    "e2e: ponta a ponta com ambiente completo",
]

[tool.coverage.run]
source = ["src/rag"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
